<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot the Differences Game</title>
    <style>
        body {
            background-color: yellow;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin-top: 20px;
            font-size: 2.5em;
        }
        h2 {
            margin-top: 10px;
            font-size: 1.5em;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 40px;
        }
        .box {
            border: 2px solid black;
            padding: 20px;
            background-color: white;
            width: 350px;
            height: 350px;
            position: relative;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h1>Visual Voyage</h1>
<h2>Spot the Difference</h2>
<div class="container">
    <div class="box">
        <div class="image-container">
            <img src="pic1.jpg" alt="Image 1" class="image">
        </div>
    </div>
    <div class="box">
        <div class="image-container" id="image-container2">
            <img src="pic2.jpg" alt="Image 2" class="image" id="image2">
            <!-- Circles will be added dynamically here -->
        </div>
    </div>
</div>

<script>
    let correctClicks = 0;
    const maxCorrectClicks = 3;
    const correctRegions = [
        {x: 160, y:70, radius: 30},
        {x: 170, y: 185, radius: 30},
        {x: 220, y: 260, radius: 30},
    ];

    document.getElementById('image-container2').addEventListener('click', function(event) {
        const rect = event.target.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        let isCorrectClick = false;

        for (const region of correctRegions) {
            const dx = x - region.x;
            const dy = y - region.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < region.radius) {
                isCorrectClick = true;
                break;
            }
        }

        const circle = document.createElement('div');
        circle.classList.add('circle');
        circle.style.width = '30px';
        circle.style.height = '30px';
        circle.style.left = `${x - 15}px`;
        circle.style.top = `${y - 15}px`;

        if (isCorrectClick) {
            circle.style.border = '2px solid green';
            correctClicks++;
        } else {
            circle.style.border = '2px solid red';
        }

        this.appendChild(circle);

        if (correctClicks === maxCorrectClicks) {
            setTimeout(() => {
                alert('Congratulations, you have won the game!');
            }, 100);
        }
    });
</script>

</body>
</html>
